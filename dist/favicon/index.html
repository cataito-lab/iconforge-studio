<script>
(function () {
  'use strict';
  var t = function (k) { return (window.CATAITO_I18N && window.CATAITO_I18N.t) ? window.CATAITO_I18N.t(k) : k; };
  var SIZES = [16, 32, 48, 64, 128, 180, 192, 256, 512];
  var DEFAULTS = { 16:1, 32:1, 48:1, 180:1, 192:1, 512:1 };
  var fvImage = null;

  /* ---------- 复用 IconForge 已验证的 ICO / ZIP 核心 ---------- */
  function generateIcoBytes(canvases) {
    var numImages = canvases.length;
    var headerLength = 6 + numImages * 16;
    var imageDataArray = [];
    for (var ci = 0; ci < canvases.length; ci++) {
      var canvas = canvases[ci];
      var dataUrl = canvas.toDataURL('image/png');
      var bin = atob(dataUrl.split(',')[1]);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      imageDataArray.push({ bytes: bytes, width: canvas.width, height: canvas.height });
    }
    var totalLength = headerLength;
    imageDataArray.forEach(function (it) { totalLength += it.bytes.length; });
    var buffer = new ArrayBuffer(totalLength);
    var view = new DataView(buffer);
    var bytesView = new Uint8Array(buffer);
    view.setUint16(0, 0, true);
    view.setUint16(2, 1, true);
    view.setUint16(4, numImages, true);
    var offset = 6, dataOffset = headerLength;
    imageDataArray.forEach(function (it) {
      var w = it.width >= 256 ? 0 : it.width;
      var h = it.height >= 256 ? 0 : it.height;
      bytesView[offset] = w; bytesView[offset + 1] = h; bytesView[offset + 2] = 0; bytesView[offset + 3] = 0;
      view.setUint16(offset + 4, 1, true);
      view.setUint16(offset + 6, 32, true);
      view.setUint32(offset + 8, it.bytes.length, true);
      view.setUint32(offset + 12, dataOffset, true);
      bytesView.set(it.bytes, dataOffset);
      dataOffset += it.bytes.length;
      offset += 16;
    });
    return new Uint8Array(buffer);
  }
  function pngBytes(canvas) {
    var dataUrl = canvas.toDataURL('image/png');
    var bin = atob(dataUrl.split(',')[1]);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  var CRC_TABLE = null;
  function getCrcTable() {
    if (CRC_TABLE) return CRC_TABLE;
    CRC_TABLE = new Uint32Array(256);
    for (var i = 0; i < 256; i++) {
      var c = i;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      CRC_TABLE[i] = c >>> 0;
    }
    return CRC_TABLE;
  }
  function crc32(buf) {
    var table = getCrcTable();
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) crc = table[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function buildZip(files) {
    var enc = new TextEncoder();
    var chunks = [], central = [], offset = 0;
    var now = new Date();
    var dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((now.getSeconds() >> 1) & 31);
    var dosDate = ((Math.max(0, now.getFullYear() - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);
    for (var f = 0; f < files.length; f++) {
      var nameBytes = enc.encode(files[f].name);
      var data = files[f].data;
      var crc = crc32(data);
      var local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true);
      local.setUint16(8, 0, true); local.setUint16(10, dosTime, true); local.setUint16(12, dosDate, true);
      local.setUint32(14, crc, true); local.setUint32(18, data.length, true); local.setUint32(22, data.length, true);
      local.setUint16(26, nameBytes.length, true); local.setUint16(28, 0, true);
      chunks.push(new Uint8Array(local.buffer), nameBytes, data);
      var cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true);
      cd.setUint16(10, 0, true); cd.setUint16(12, dosTime, true); cd.setUint16(14, dosDate, true);
      cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true);
      cd.setUint16(28, nameBytes.length, true); cd.setUint16(30, 0, true); cd.setUint16(32, 0, true); cd.setUint16(34, 0, true); cd.setUint16(36, 0, true);
      cd.setUint32(38, 0, true); cd.setUint32(42, offset, true);
      central.push({ header: new Uint8Array(cd.buffer), name: nameBytes });
      offset += 30 + nameBytes.length + data.length;
    }
    var centralStart = offset, centralSize = 0;
    central.forEach(function (c) { chunks.push(c.header, c.name); centralSize += c.header.length + c.name.length; });
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
    end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, centralSize, true); end.setUint32(16, centralStart, true); end.setUint16(20, 0, true);
    chunks.push(new Uint8Array(end.buffer));
    return new Blob(chunks, { type: 'application/zip' });
  }

  /* ---------- 工具逻辑 ---------- */
  function fvResize(img, size) {
    var c = document.createElement('canvas'); c.width = size; c.height = size;
    var ctx = c.getContext('2d'); ctx.clearRect(0, 0, size, size);
    var s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
    return c;
  }
  function loadFile(file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) { showToast(t('fv_toast_img_type'), true); return; }
    var r = new FileReader();
    r.onload = function (e) {
      var img = new Image();
      img.onload = function () { fvImage = img; showPreview(); };
      img.onerror = function () { showToast(t('fv_toast_img_parse'), true); };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  }
  function showPreview() {
    document.getElementById('fv-preview').hidden = false;
    document.getElementById('fv-preview-img').src = fvImage.src;
    document.getElementById('fv-dropzone').classList.add('has-image');
  }
  function getSelected() {
    var out = [];
    SIZES.forEach(function (s) {
      var el = document.getElementById('fv-size-' + s);
      if (el && el.checked) out.push(s);
    });
    return out;
  }
  function generate() {
    if (!fvImage) { showToast(t('fv_toast_no_img'), true); return; }
    var sel = getSelected();
    if (!sel.length) { showToast(t('fv_toast_no_size'), true); return; }
    var canvases = sel.map(function (s) { return { size: s, canvas: fvResize(fvImage, s) }; });
    var files = [];
    var icoCanvases = canvases.filter(function (c) { return c.size <= 256; });
    if (icoCanvases.length) files.push({ name: 'favicon.ico', data: generateIcoBytes(icoCanvases.map(function (c) { return c.canvas; })) });
    canvases.forEach(function (c) { files.push({ name: 'favicon-' + c.size + '.png', data: pngBytes(c.canvas) }); });
    var zip = buildZip(files);
    var a = document.createElement('a');
    a.href = URL.createObjectURL(zip);
    a.download = 'favicon-pack.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    showToast(t('fv_toast_done'));
  }

  /* ---------- 提示 ---------- */
  var toastTimer = null;
  function showToast(msg, isErr) {
    var t = document.getElementById('fv-toast');
    t.textContent = msg;
    t.className = 'fv-toast show' + (isErr ? ' err' : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'fv-toast'; }, 2600);
  }

  /* ---------- 初始化 UI ---------- */
  var chips = document.getElementById('fv-chips');
  SIZES.forEach(function (s) {
    var id = 'fv-size-' + s;
    var label = document.createElement('label');
    label.className = 'fv-chip' + (DEFAULTS[s] ? ' on' : '');
    label.innerHTML = '<input type="checkbox" id="' + id + '"' + (DEFAULTS[s] ? ' checked' : '') + '><span>' + s + '</span>';
    chips.appendChild(label);
  });
  var dz = document.getElementById('fv-dropzone');
  var fileInput = document.getElementById('fv-file');
  dz.addEventListener('click', function () { fileInput.click(); });
  dz.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  fileInput.addEventListener('change', function (e) { loadFile(e.target.files[0]); });
  ['dragenter', 'dragover'].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('drag'); });
  });
  dz.addEventListener('drop', function (e) {
    var dt = e.dataTransfer;
    if (dt && dt.files && dt.files[0]) loadFile(dt.files[0]);
  });
  document.getElementById('fv-clear').addEventListener('click', function (e) {
    e.stopPropagation();
    fvImage = null; fileInput.value = '';
    document.getElementById('fv-preview').hidden = true;
    dz.classList.remove('has-image');
  });
  document.getElementById('fv-generate').addEventListener('click', generate);
})();
</script>
